{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - Pedal Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
    <script>
        // Auto redirect after 3 seconds
        setTimeout(function() {
            window.location.href = 'http://localhost:5173/login';
        }, 3000);
    </script>
</head>
<body class="flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-green-600 to-green-700 text-white p-8 text-center">
            <div class="text-5xl mb-3">✅</div>
            <h1 class="text-3xl font-bold mb-2">Password Reset!</h1>
            <p class="text-green-100">Pedal Point</p>
        </div>

        <!-- Content -->
        <div class="p-8 text-center">
            <div class="bg-green-50 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4 animate-bounce">
                <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            
            <h2 class="text-2xl font-bold text-gray-800 mb-3">Success! 🎉</h2>
            <p class="text-gray-600 mb-6">Your password has been reset successfully. You can now log in with your new password.</p>
            
            <div class="flex items-center justify-center gap-2 text-sm text-gray-500 mb-6">
                <span class="loading loading-spinner loading-sm"></span>
                <span>Redirecting to login page...</span>
            </div>

            <a href="http://localhost:5173/login" 
               class="inline-block w-full bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-semibold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200">
                Go to Login Page
            </a>
        </div>

        <!-- Footer -->
        <div class="bg-gray-50 p-6 text-center border-t border-gray-200">
            <p class="text-xs text-gray-500">© 2024 Pedal Point. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
